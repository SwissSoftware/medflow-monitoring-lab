global:
  resolve_timeout: 5m

# ============================================================
# Route-Konfiguration
# Studierende ergänzen das Routing in Aufgabe 4
# ============================================================
route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  # AUFGABE 4: Child-Routes hier ergänzen
  routes: []
    # TODO: Critical → pagerduty-critical
    # TODO: Warning → slack-warning
    # TODO: Info → email-info

# ============================================================
# Receiver-Konfiguration (Simulation – kein echter Versand)
# Alle Meldungen landen beim Webhook-Empfänger: http://localhost:9999/
# ============================================================
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://webhook-sink:9999/default'
        send_resolved: true

  - name: 'pagerduty-critical'
    webhook_configs:
      - url: 'http://webhook-sink:9999/pagerduty'
        send_resolved: true

  - name: 'slack-warning'
    webhook_configs:
      - url: 'http://webhook-sink:9999/slack'
        send_resolved: true

  - name: 'email-info'
    webhook_configs:
      - url: 'http://webhook-sink:9999/email'
        send_resolved: true

# ============================================================
# Inhibition Rules
# ============================================================
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['service', 'vehicle_id']
